function Mandala({ className = "", spin = 90 }: { className?: string; spin?: number }) {
  return (
    <svg viewBox="0 0 200 200" className={className} aria-hidden="true" fill="none" stroke="currentColor" strokeWidth="1">
      <g style={{ transformOrigin: "100px 100px", animation: `spin ${spin}s linear infinite` }}>

        {[...Array(8)].map((_, i) => <path key={i} transform={`rotate(${i * 45} 100 100)`} d="M100 68Q114 85 100 102Q86 85 100 68Z" />)}
        <circle cx="100" cy="100" r="64" strokeDasharray="2 4" /><circle cx="100" cy="100" r="12" />
      </g>

}

function Petals() {
  const ps = useMemo(() => [...Array(16)].map((_, i) => ({ l: (i * 61) % 100, d: (i * 1.7) % 9, t: 9 + ((i * 3) % 8), s: 10 + ((i * 5) % 12) })), []);

    </div>
  );
}

function useMusic() {
  const ref = useRef<any>(null);
  const [on, setOn] = useState(false);
  const start = useCallback(() => {
    if (ref.current) return;
    const AC = window.AudioContext || (window as any).webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const gain = ctx.createGain(); gain.gain.value = 0; gain.connect(ctx.destination);
    gain.gain.setTargetAtTime(0.6, ctx.currentTime, 1);
    const delay = ctx.createDelay(); delay.delayTime.value = 0.32;
    const fb = ctx.createGain(); fb.gain.value = 0.35; delay.connect(fb); fb.connect(delay); delay.connect(gain);
    [146.83, 220, 293.66].forEach((f) => {
      const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = 0.05; o.connect(g); g.connect(gain); o.start();
    });
    const pluck = (f: number) => {
      const t = ctx.currentTime, o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass";
      lp.frequency.setValueAtTime(3000, t); lp.frequency.exponentialRampToValueAtTime(400, t + 1.2);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
      o.connect(lp); lp.connect(g); g.connect(gain); g.connect(delay); o.start(t); o.stop(t + 1.7);
    };
    const raga = [293.66, 329.63, 369.99, 440, 493.88, 587.33]; // Bhoopali
    const seq = [0, 1, 2, 3, 2, 1, 2, -1, 1, 2, 3, 4, 3, 2, 1, 0, 2, 3, 4, 5, 4, 3, 2, 1];
    let n = 0;
    const timer = window.setInterval(() => {
      if (ctx.state !== "running") return;
      const k = seq[n++ % seq.length]; if (k >= 0) pluck(raga[k]);
    }, 520);
    ref.current = { ctx, gain, timer };
    setOn(true);
  }, []);
  const toggle = useCallback(() => {
    if (!ref.current) return start();
    const { ctx, gain } = ref.current;
    if (on) { gain.gain.setTargetAtTime(0, ctx.currentTime, 0.1); setTimeout(() => ctx.suspend(), 500); }
    else { ctx.resume(); gain.gain.setTargetAtTime(0.6, ctx.currentTime, 0.2); }
    setOn(!on);
  }, [on, start]);
  return { on, start, toggle };
}

function Envelope({ onStart, onDone }: { onStart: () => void; onDone: () => void }) {

        <motion.div className="absolute left-0 right-0 top-0 h-[56%]"

        <div className="absolute left-1/2 top-[56%] -translate-x-1/2 -translate-y-1/2" style={{ zIndex: 5 }}>

    </motion.div>
  );
}

const Couple = () => (

const Welcome = () => (

function Sparkles() {
  return (
    <div className="absolute inset-0 pointer-events-none" aria-hidden="true">
      {[...Array(14)].map((_, i) => {
        const a = (i / 14) * 6.283, r = 90 + (i % 3) * 25;
        return <motion.span key={i} className="absolute left-1/2 top-1/2 text-gold" initial={{ x: 0, y: 0, opacity: 1, scale: 0.4 }}

}

function ScratchHeart({ size, title, date, time }: { size: number; title: string; date: string; time: string }) {
  const cv = useRef<HTMLCanvasElement>(null);
  const doneRef = useRef(false);
  const [done, setDone] = useState(false);
  const finish = useCallback(() => { if (doneRef.current) return; doneRef.current = true; setDone(true); }, []);
  useEffect(() => {
    const c = cv.current!, dpr = Math.min(window.devicePixelRatio || 1, 2), S = Math.round(size * dpr);
    c.width = c.height = S;
    const x = c.getContext("2d", { willReadFrequently: true })!;
    x.beginPath(); x.moveTo(S / 2, S * 0.92);
    x.bezierCurveTo(-S * 0.1, S * 0.55, S * 0.02, S * 0.02, S / 2, S * 0.28);
    x.bezierCurveTo(S * 0.98, S * 0.02, S * 1.1, S * 0.55, S / 2, S * 0.92); x.closePath();
    const g = x.createLinearGradient(0, 0, S, S);
    ["#8d6a1f", "#f3dc8f", "#c9a24a", "#fff1b8", "#a8802c"].forEach((col, i, a) => g.addColorStop(i / (a.length - 1), col));
    x.fillStyle = g; x.fill();
    x.save(); x.clip(); x.globalAlpha = 0.25;
    for (let i = 0; i < 160; i++) { x.fillStyle = i % 2 ? "#fff" : "#7a5a15"; x.fillRect(Math.random() * S, Math.random() * S, S * 0.012, S * 0.012 * (1 + Math.random() * 6)); }
    x.restore();
    x.globalAlpha = 1; x.fillStyle = "rgba(90,60,10,.7)"; x.font = `700 ${S * 0.08}px 'Cormorant Garamond',serif`; x.textAlign = "center";
    x.fillText("✦ SCRATCH ✦", S / 2, S * 0.52);
    const sample = () => { const d = x.getImageData(0, 0, S, S).data; let n = 0; for (let i = 3; i < d.length; i += 16) if (d[i] > 128) n++; return n; };
    const total = sample();
    const check = () => { if (1 - sample() / total >= 0.55) finish(); };
    let down = false, lx = 0, ly = 0, cnt = 0;
    const pos = (e: PointerEvent) => { const r = c.getBoundingClientRect(); return [((e.clientX - r.left) * S) / r.width, ((e.clientY - r.top) * S) / r.height]; };
    const mv = (e: PointerEvent) => {
      if (!down || doneRef.current) return;
      e.preventDefault(); e.stopPropagation();
      const [px, py] = pos(e);
      x.globalCompositeOperation = "destination-out"; x.lineWidth = S * 0.11; x.lineCap = "round"; x.lineJoin = "round";
      x.beginPath(); x.moveTo(lx, ly); x.lineTo(px + 0.01, py); x.stroke(); lx = px; ly = py;
      if (++cnt % 8 === 0) check();
    };
    const dn = (e: PointerEvent) => { e.preventDefault(); e.stopPropagation(); c.setPointerCapture(e.pointerId); down = true; [lx, ly] = pos(e); mv(e); };
    const up = (e: PointerEvent) => { e.stopPropagation(); if (down) { down = false; check(); } };
    c.addEventListener("pointerdown", dn); c.addEventListener("pointermove", mv);
    c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
    return () => { c.removeEventListener("pointerdown", dn); c.removeEventListener("pointermove", mv); c.removeEventListener("pointerup", up); c.removeEventListener("pointercancel", up); };
  }, [size, finish]);
  const big = size > 200;
  const fs = big ? 17 : Math.max(10.5, size * 0.066);
  return (
    <div className="relative" style={{ width: size, height: size }} data-noswipe>
      <svg viewBox="0 0 100 100" className={`absolute inset-0 w-full h-full overflow-visible ${done ? "glow" : ""}`} aria-hidden="true">
        <path d="M50 92C-10 55 2 2 50 28C98 2 110 55 50 92Z" fill="#fff4f6" stroke="#c9a24a" strokeWidth="1.2" />
      </svg>
      <div className="absolute left-[14%] right-[14%] top-[30%] h-[38%] flex flex-col items-center justify-center text-center text-maroon font-bold" style={{ fontSize: fs, lineHeight: 1.18 }}>
        {big ? <span className="font-script gold" style={{ fontSize: fs * 1.8, lineHeight: 1.1 }}>{title}</span> : <span className="text-[#8a1636] mb-0.5">{title}</span>}
        <span>{date}</span><span>{time}</span>
      </div>
      <canvas ref={cv} tabIndex={done ? -1 : 0} role="button" aria-label={`Scratch to reveal ceremony details. Press Enter to reveal instantly.`}
        onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); finish(); } }}
        className="absolute inset-0 w-full h-full transition-opacity duration-700"
        style={{ opacity: done ? 0 : 1, pointerEvents: done ? "none" : "auto", touchAction: "none", cursor: "crosshair" }} />
      {done && <Sparkles />}
    </div>
  );
}
const SM = Math.min(172, Math.floor((Math.min(window.innerWidth, 480) - 8) / 2));
const Scratch = () => (
  <Slide>
    <h2 className="font-script text-5xl gold">Scratch to Reveal</h2>
    <p className="text-lg -mt-2">Scratch each heart to discover our celebrations</p>
    <ScratchHeart size={280} title="You’re Invited" date="24 November 2026" time="Tuesday, 2 PM" />
    <div className="flex gap-1 justify-center -mt-4 -mx-6">
      <ScratchHeart size={SM} title="Haldi & Mehandi Ceremony" date="22 November 2026" time="Sunday, 12 PM" />
      <ScratchHeart size={SM} title="Lagun Ceremony" date="20 November 2026" time="Friday, 4 PM" />
    </div>
  </Slide>
);

function useCountdown() {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  const d = Math.max(0, WEDDING - now);
  return { ended: now >= WEDDING, v: [Math.floor(d / 864e5), Math.floor(d / 36e5) % 24, Math.floor(d / 6e4) % 60, Math.floor(d / 1e3) % 60] };
}
function Countdown() {
  const { ended, v } = useCountdown();
  const labels = ["Days", "Hours", "Minutes", "Seconds"];
  return (
    <Slide>
      <h2 className="font-script text-5xl gold leading-snug">Counting Down to Forever ❤️</h2>
      {ended ? (
        <motion.p initial={{ scale: 0.8, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="text-3xl max-w-sm">🎉 The big day is here! Vivek &amp; Chitra are celebrating today — thank you for being part of it. 🎉</motion.p>
      ) : (
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4" role="timer" aria-label="Time until the wedding">
          {v.map((n, i) => (
            <div key={i} className="w-28 py-4 rounded-2xl border border-gold/80 bg-black/25 shadow-lg shadow-black/40">
              <div className="overflow-hidden h-14"><motion.div key={n} initial={{ y: -22, opacity: 0 }} animate={{ y: 0, opacity: 1 }} className="font-serif text-5xl font-bold gold">{String(n).padStart(2, "0")}</motion.div></div>
              <div className="text-xs tracking-[0.3em] uppercase opacity-80">{labels[i]}</div>
            </div>
          ))}
        </div>
      )}
      <p className="text-lg">24 November 2026 · 2:00 PM IST</p>
    </Slide>
  );
}
const MAPS2 = "https://share.google/P4cObyDJPiE86wId2";
function VenueCard({ tag, when, name, addr, href }: { tag: string; when: string; name: string; addr: string; href: string }) {

const Venue = () => (
  <Slide>
    <h2 className="font-script text-5xl gold">Our Venues 📍</h2>
    <VenueCard tag="Wedding Venue" when="24 November 2026 · Tuesday, 2 PM" name="S.R. Farm House" addr="Nagla Rambal, Kalindi Vihar, Agra" href={MAPS} />
    <VenueCard tag="Lagun Ceremony Venue" when="20 November 2026 · Friday, 4 PM" name="Gokul Marriage Home" addr="Lauharra, Uttar Pradesh" href={MAPS2} />

const Closing = ({ onReplay }: { onReplay: () => void }) => (
  <Slide>
    <Mandala className="w-20 text-gold" spin={60} />
    <h2 className="font-script text-5xl gold leading-snug">We Can’t Wait to Celebrate With You!</h2>

const SLIDES: React.ComponentType<{ onReplay: () => void }>[] = [Couple, Welcome, Scratch, Countdown, Venue, Closing];
const N = SLIDES.length;
const DARK = [false, true, false, true, false, true];
const V: any = {
  in: (d: Dir) => ({ x: d * 70, opacity: 0 }),
  mid: { x: 0, opacity: 1, transition: { duration: 0.45 } },
  out: (d: Dir) => ({ x: -d * 70, opacity: 0, transition: { duration: 0.3 } }),
};

function App() {
  const [opened, setOpened] = useState(false);
  const [i, setI] = useState(0);
  const [dir, setDir] = useState<Dir>(1);
  const music = useMusic();
  const sw = useRef<{ x: number; y: number } | null>(null);
  const go = useCallback((n: number) => { if (n < 0 || n >= N || n === i) return; setDir(n > i ? 1 : -1); setI(n); }, [i]);
  const replay = () => { setOpened(false); setI(0); setDir(1); };
  useEffect(() => {
    const k = (e: KeyboardEvent) => { if (!opened) return; if (e.key === "ArrowRight") go(i + 1); if (e.key === "ArrowLeft") go(i - 1); };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, [go, i, opened]);
  const S = SLIDES[i];
  const dark = opened && DARK[i];
  return (
    <div className={`fixed inset-0 select-none ${dark ? "dk text-ivory" : "text-maroon"}`} style={{ background: dark ? "radial-gradient(circle at 50% 15%,#9a1b40,transparent 60%),radial-gradient(circle at 85% 95%,#2e040d,transparent 55%),#4a0716" : "radial-gradient(circle at 15% 8%,#f9c5d1,transparent 55%),radial-gradient(circle at 88% 92%,#f4d6a0,transparent 50%),linear-gradient(180deg,#fff2f4,#fbf5ea)" }}>
      <Petals />
      <button onClick={music.toggle} aria-pressed={music.on} aria-label={music.on ? "Mute music" : "Play music"}
        className="fixed right-3 z-50 nb" style={{ top: "calc(env(safe-area-inset-top,0px) + 12px)", background: "#fff9", fontSize: 18 }}>{music.on ? "🔊" : "🔇"}</button>
      <AnimatePresence>
        {!opened && <Envelope key="env" onStart={music.start} onDone={() => setOpened(true)} />}
      </AnimatePresence>
      {opened && (
        <>
          <div className="pointer-events-none absolute inset-3 rounded-2xl border border-gold/60" />
          <div className="pointer-events-none absolute inset-5 rounded-xl border border-gold/30" />
          <Mandala className="pointer-events-none absolute -top-16 -right-16 w-52 text-gold/25" spin={140} />
          <Mandala className="pointer-events-none absolute -bottom-16 -left-16 w-52 text-gold/25" spin={160} />
          <div className="absolute top-0 left-0 h-1 bg-gradient-to-r from-gold to-maroon transition-all duration-500 z-20" style={{ width: `${((i + 1) / N) * 100}%` }} />
          <div className="absolute inset-0 overflow-y-auto overscroll-contain" style={{ touchAction: "pan-y" }}
            onPointerDown={(e) => { sw.current = (e.target as HTMLElement).closest("[data-noswipe],a,button") ? null : { x: e.clientX, y: e.clientY }; }}
            onPointerUp={(e) => {
              const s = sw.current; sw.current = null; if (!s) return;
              const dx = e.clientX - s.x, dy = e.clientY - s.y;
              if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(i + (dx < 0 ? 1 : -1));
            }}>
            <AnimatePresence mode="wait" custom={dir}>
              <motion.div key={i} custom={dir} variants={V} initial="in" animate="mid" exit="out" className="min-h-full"><S onReplay={replay} /></motion.div>
            </AnimatePresence>
          </div>
          <nav aria-label="Slides" className={`absolute bottom-0 inset-x-0 z-20 flex items-center justify-center gap-4 px-4 pt-3 bg-gradient-to-t to-transparent ${dark ? "from-[#4a0716] via-[#4a0716]/90" : "from-ivory via-ivory/90"}`} style={{ paddingBottom: "calc(env(safe-area-inset-bottom,0px) + 14px)" }}>
            <button className="nb" aria-label="Previous slide" disabled={i === 0} onClick={() => go(i - 1)}>‹</button>
            <ol className="flex gap-2 m-0 p-0 list-none">
              {SLIDES.map((_, n) => (
                <li key={n}><button aria-label={`Go to slide ${n + 1} of ${N}`} aria-current={n === i ? "step" : undefined} onClick={() => go(n)}
                  className={`block h-2.5 rounded-full transition-all ${n === i ? (dark ? "w-7 bg-gold" : "w-7 bg-maroon") : "w-2.5 bg-gold/60"}`} /></li>
              ))}
            </ol>
            <button className="nb" aria-label="Next slide" disabled={i === N - 1} onClick={() => go(i + 1)}>›</button>
          </nav>
        </>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<MotionConfig reducedMotion="user"><App /></MotionConfig>);
</script>
<script>
if(!window.Motion){ // graceful fallback: static (no animation) if the animation library fails to load
  const strip=({initial,animate,exit,variants,transition,custom,whileTap,whileHover,...r})=>r;
  window.Motion={motion:new Proxy({},{get:(_,t)=>React.forwardRef((p,ref)=>React.createElement(t,{...strip(p),ref}))}),AnimatePresence:({children})=>children,MotionConfig:({children})=>children};
}
const src=document.getElementById('app').textContent;
const out=Babel.transform(src,{presets:[['typescript',{isTSX:true,allExtensions:true}],'react']}).code;
const s=document.createElement('script');
s.textContent='(function(){'+out+'})();';
document.body.appendChild(s);
</script>
